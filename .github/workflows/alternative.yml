name: Test & Deploy via Git Pull

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: Unit tests (fail fast — deployment never runs if this fails)
  # ============================================================
  test:
    name: Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify PHP & SQLite
        shell: powershell
        run: |
          php -v
          php -m | Select-String -Pattern "pdo_sqlite|sqlite3"

      - name: Install Composer Dependencies
        shell: powershell
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit Tests
        shell: powershell
        run: vendor\bin\phpunit --testdox

  # ============================================================
  # Job 2: Deploy — only runs if tests pass
  # ============================================================
  deploy:
    name: Deploy via Git Pull
    runs-on: self-hosted
    needs: test
    steps:
      - name: Pull Latest Code in Deployment Directory
        shell: powershell
        run: |
          $deployDir = "C:\MarPunyaWork\Github\htp-deployment\demo-php-github"

          if (-not (Test-Path $deployDir)) {
              throw "Deployment directory not found: $deployDir. Clone the repo there first."
          }

          if (-not (Test-Path (Join-Path $deployDir ".git"))) {
              throw "$deployDir is not a Git repository. Clone it first."
          }

          Set-Location $deployDir

          Write-Host "Fetching from origin..."
          git fetch --all --prune

          $branch = "main"
          Write-Host "Checking out branch: $branch"
          git checkout $branch

          Write-Host "Pulling latest commits..."
          git pull --ff-only origin $branch

          Write-Host ""
          Write-Host "Deployed commit:"
          git log -1 --oneline

      - name: Install Composer Dependencies (Deployment)
        shell: powershell
        working-directory: C:\MarPunyaWork\Github\htp-deployment\demo-php-github
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Smoke Test Deployment
        shell: powershell
        run: |
          $deployDir = "C:\MarPunyaWork\Github\htp-deployment\demo-php-github\src"
          if (-not (Test-Path (Join-Path $deployDir "index.php"))) {
              throw "index.php missing in deployed src folder"
          }
          if (-not (Test-Path (Join-Path $deployDir "db.php"))) {
              throw "db.php missing in deployed src folder"
          }
          Write-Host "Deployment smoke test passed - core files present"

      - name: Deployment Summary
        shell: powershell
        run: |
          Write-Host "Deployment complete"
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "Deployed to: C:\MarPunyaWork\Github\htp-deployment\demo-php-github"
          Write-Host ""
          Write-Host "To run the app:"
          Write-Host "  cd C:\MarPunyaWork\Github\htp-deployment\demo-php-github\src"
          Write-Host "  php -S localhost:8118"